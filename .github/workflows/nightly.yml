name: Nightly Release

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-nightly:
    runs-on: ubuntu-latest

    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      windows_bundle_name: ${{ steps.artifacts.outputs.windows_bundle_name }}
      windows_archive_name: ${{ steps.artifacts.outputs.windows_archive_name }}
      macos_bundle_name: ${{ steps.artifacts.outputs.macos_bundle_name }}
      macos_archive_name: ${{ steps.artifacts.outputs.macos_archive_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changes since last release
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No v* tags found. Treating as first release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$(git log "$latest_tag..HEAD" --oneline)" ]]; then
            echo "No new commits since $latest_tag. Skipping release."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since $latest_tag. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: version
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [[ -z "$latest_tag" ]]; then
            new_version="$(python -c "namespace = {}; exec(compile(open('src/spkup/__init__.py', encoding='utf-8').read(), 'src/spkup/__init__.py', 'exec'), namespace); print(namespace['__version__'])")"
            echo "No tags found. Using version from __init__.py: $new_version"
          else
            base_version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$base_version"
            new_version="$major.$minor.$((patch + 1))"
            echo "Latest tag: $latest_tag. Bumping to $new_version"

            perl -0pi -e "s/__version__\\s*=\\s*['\\\"][0-9]+\\.[0-9]+\\.[0-9]+['\\\"]/__version__ = \\\"$new_version\\\"/" src/spkup/__init__.py

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/spkup/__init__.py
            git commit -m "chore: bump version to $new_version [skip ci]"
            git push origin HEAD:main
          fi

          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$new_version" >> "$GITHUB_OUTPUT"

      - name: Resolve artifact names
        id: artifacts
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          echo "windows_bundle_name=spkup-$version-windows-x64" >> "$GITHUB_OUTPUT"
          echo "windows_archive_name=spkup-$version-windows-x64.zip" >> "$GITHUB_OUTPUT"
          echo "macos_bundle_name=spkup-$version-macos-arm64" >> "$GITHUB_OUTPUT"
          echo "macos_archive_name=spkup-$version-macos-arm64.zip" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-nightly
    if: needs.prepare-nightly.outputs.has_changes == 'true'
    runs-on: windows-latest

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run test suite
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build,gpu]"
          python -m pytest tests/ -v

      - name: Build Windows artifact with PyInstaller
        shell: pwsh
        run: |
          foreach ($path in @('build', 'dist')) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }
          python -m PyInstaller --clean spkup.spec

      - name: Validate CUDA runtime DLLs in frozen bundle
        shell: pwsh
        run: python -m spkup.packaging_validation dist\spkup

      - name: Package Windows archive
        shell: pwsh
        run: |
          $distDir = Join-Path $PWD 'dist'
          $srcBundle = Join-Path $distDir 'spkup'
          if (-not (Test-Path $srcBundle)) {
            throw "Expected PyInstaller bundle at $srcBundle"
          }

          $dstBundle = Join-Path $distDir "${{ needs.prepare-nightly.outputs.windows_bundle_name }}"
          if (Test-Path $dstBundle) {
            Remove-Item $dstBundle -Recurse -Force
          }

          Rename-Item -Path $srcBundle -NewName "${{ needs.prepare-nightly.outputs.windows_bundle_name }}"

          $archivePath = Join-Path $distDir "${{ needs.prepare-nightly.outputs.windows_archive_name }}"
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          Compress-Archive -Path $dstBundle -DestinationPath $archivePath -CompressionLevel Optimal
          if (-not (Test-Path $archivePath)) {
            throw "Expected release archive at $archivePath"
          }

      - name: Upload Windows nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-nightly-${{ needs.prepare-nightly.outputs.version }}
          path: dist/${{ needs.prepare-nightly.outputs.windows_archive_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-macos-arm64:
    needs: prepare-nightly
    if: needs.prepare-nightly.outputs.has_changes == 'true'
    runs-on: macos-latest

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Assert Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run test suite
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
          python -m pytest tests/ -v

      - name: Build macOS ARM64 artifact with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m PyInstaller --clean spkup-macos.spec

      - name: Assert packaged executable is ARM64
        shell: bash
        run: file "dist/spkup.app/Contents/MacOS/spkup" | grep -q "arm64"

      - name: Package macOS archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -rf "${{ needs.prepare-nightly.outputs.macos_bundle_name }}"
          mkdir "${{ needs.prepare-nightly.outputs.macos_bundle_name }}"
          cp -R spkup.app "${{ needs.prepare-nightly.outputs.macos_bundle_name }}/"
          ditto -c -k --keepParent \
            "${{ needs.prepare-nightly.outputs.macos_bundle_name }}" \
            "${{ needs.prepare-nightly.outputs.macos_archive_name }}"
          test -f "${{ needs.prepare-nightly.outputs.macos_archive_name }}"

      - name: Upload macOS nightly artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-nightly-${{ needs.prepare-nightly.outputs.version }}
          path: dist/${{ needs.prepare-nightly.outputs.macos_archive_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-nightly:
    needs:
      - prepare-nightly
      - build-windows
      - build-macos-arm64
    if: needs.prepare-nightly.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download nightly artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "*-nightly-${{ needs.prepare-nightly.outputs.version }}"
          merge-multiple: true

      - name: Verify expected release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/${{ needs.prepare-nightly.outputs.windows_archive_name }}"
          test -f "release-assets/${{ needs.prepare-nightly.outputs.macos_archive_name }}"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.prepare-nightly.outputs.tag_name }}" -m "Release ${{ needs.prepare-nightly.outputs.tag_name }}"
          git push origin "${{ needs.prepare-nightly.outputs.tag_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-nightly.outputs.tag_name }}
          name: "spkup v${{ needs.prepare-nightly.outputs.version }}"
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/${{ needs.prepare-nightly.outputs.windows_archive_name }}
            release-assets/${{ needs.prepare-nightly.outputs.macos_archive_name }}
