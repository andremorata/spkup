name: Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-meta:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      windows_bundle_name: ${{ steps.release_meta.outputs.windows_bundle_name }}
      windows_archive_name: ${{ steps.release_meta.outputs.windows_archive_name }}
      macos_bundle_name: ${{ steps.release_meta.outputs.macos_bundle_name }}
      macos_archive_name: ${{ steps.release_meta.outputs.macos_archive_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag and derive artifact names
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z. Received: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          package_version="$(python -c "from pathlib import Path; namespace = {}; exec(Path('src/spkup/__init__.py').read_text(encoding='utf-8'), namespace); print(namespace['__version__'])")"

          if [[ "$package_version" != "$version" ]]; then
            echo "Tag $tag does not match src/spkup/__init__.py version $package_version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "windows_bundle_name=spkup-$version-windows-x64" >> "$GITHUB_OUTPUT"
          echo "windows_archive_name=spkup-$version-windows-x64.zip" >> "$GITHUB_OUTPUT"
          echo "macos_bundle_name=spkup-$version-macos-arm64" >> "$GITHUB_OUTPUT"
          echo "macos_archive_name=spkup-$version-macos-arm64.zip" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: release-meta
    runs-on: windows-latest

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build,gpu]"

      - name: Build Windows artifact with PyInstaller
        shell: pwsh
        run: |
          foreach ($path in @('build', 'dist')) {
            if (Test-Path $path) {
              Remove-Item $path -Recurse -Force
            }
          }

          python -m PyInstaller --clean spkup.spec

      - name: Validate CUDA runtime DLLs in frozen bundle
        shell: pwsh
        run: python -m spkup.packaging_validation dist\spkup

      - name: Package Windows archive
        id: package
        shell: pwsh
        run: |
          $distDir = Join-Path $PWD 'dist'
          $sourceBundle = Join-Path $distDir 'spkup'
          if (-not (Test-Path $sourceBundle)) {
            throw "Expected PyInstaller bundle at $sourceBundle"
          }

          $versionedBundle = Join-Path $distDir "${{ needs.release-meta.outputs.windows_bundle_name }}"
          if (Test-Path $versionedBundle) {
            Remove-Item $versionedBundle -Recurse -Force
          }

          Rename-Item -Path $sourceBundle -NewName "${{ needs.release-meta.outputs.windows_bundle_name }}"

          $archivePath = Join-Path $distDir "${{ needs.release-meta.outputs.windows_archive_name }}"
          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          Compress-Archive -Path $versionedBundle -DestinationPath $archivePath -CompressionLevel Optimal

          if (-not (Test-Path $archivePath)) {
            throw "Expected release archive at $archivePath"
          }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-${{ needs.release-meta.outputs.version }}
          path: dist/${{ needs.release-meta.outputs.windows_archive_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Windows packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-diagnostics-${{ github.run_number }}
          path: |
            build/spkup/warn-spkup.txt
            build/spkup/xref-spkup.html
          if-no-files-found: ignore
          retention-days: 7

  build-macos-arm64:
    needs: release-meta
    runs-on: macos-latest

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Assert Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Build macOS ARM64 artifact with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m PyInstaller --clean spkup-macos.spec

      - name: Assert packaged executable is ARM64
        shell: bash
        run: |
          set -euo pipefail
          file "dist/spkup.app/Contents/MacOS/spkup" | grep -q "arm64"

      - name: Package macOS archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -rf "${{ needs.release-meta.outputs.macos_bundle_name }}"
          mkdir "${{ needs.release-meta.outputs.macos_bundle_name }}"
          cp -R spkup.app "${{ needs.release-meta.outputs.macos_bundle_name }}/"
          ditto -c -k --keepParent \
            "${{ needs.release-meta.outputs.macos_bundle_name }}" \
            "${{ needs.release-meta.outputs.macos_archive_name }}"
          test -f "${{ needs.release-meta.outputs.macos_archive_name }}"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-release-${{ needs.release-meta.outputs.version }}
          path: dist/${{ needs.release-meta.outputs.macos_archive_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload macOS packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-diagnostics-${{ github.run_number }}
          path: |
            build/spkup-macos/warn-spkup-macos.txt
            build/spkup-macos/xref-spkup-macos.html
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    needs:
      - release-meta
      - build-windows
      - build-macos-arm64
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "*-release-${{ needs.release-meta.outputs.version }}"
          merge-multiple: true

      - name: Verify expected release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/${{ needs.release-meta.outputs.windows_archive_name }}"
          test -f "release-assets/${{ needs.release-meta.outputs.macos_archive_name }}"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: spkup v${{ needs.release-meta.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/${{ needs.release-meta.outputs.windows_archive_name }}
            release-assets/${{ needs.release-meta.outputs.macos_archive_name }}
